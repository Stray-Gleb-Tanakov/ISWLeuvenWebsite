# Template for the food-api Secret. Copy to k8s-secret.yaml (gitignored), fill
# in every <...>, then apply by hand:
#   kubectl apply -f food-api/k8s-secret.yaml
# Kept out of k8s/ on purpose: ArgoCD syncs that folder and would deploy this.
apiVersion: v1
kind: Secret
metadata:
  name: food-api-secrets
  namespace: iswleuven
type: Opaque
stringData:
  # Food database (food_categories, food_items)
  DB_HOST: "<db-host>"
  DB_PORT: "<db-port>"
  DB_USER: "<db-user>"
  DB_PASSWORD: "<db-password>"
  DB_NAME: "<db-name>"
