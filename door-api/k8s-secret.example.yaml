# Template for the door-api Secret. Copy to k8s-secret.yaml (gitignored), fill
# in every <...>, then apply by hand:
#   kubectl apply -f door-api/k8s-secret.yaml
# Kept out of k8s/ on purpose: ArgoCD syncs that folder and would deploy this.
apiVersion: v1
kind: Secret
metadata:
  name: door-api-secrets
  namespace: iswleuven
type: Opaque
stringData:
  # The door sensor Pi sends this as X-Door-Token
  # (website_api_token in ISW_Deursensor/config.py). Generate with: openssl rand -hex 24
  DOOR_SENSOR_TOKEN: "<door-sensor-token>"

  # Optional fallback while the sensor is offline: a Discord bot with View Channel +
  # Read Message History on the channel the door sensor's webhook posts to.
  # DISCORD_BOT_TOKEN: "<discord-bot-token>"
  # DOOR_CHANNEL_ID: "<discord-channel-id>"
