apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iswleuven-website
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Stray-Gleb-Tanakov/ISWLeuvenWebsite.git
    targetRevision: BrANCHTEST
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: iswleuven
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true