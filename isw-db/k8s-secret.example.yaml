# Template for the isw-db Secret. Copy to k8s-secret.yaml (gitignored), fill
# in every <...>, then apply by hand BEFORE isw-db first starts:
#   kubectl apply -f isw-db/k8s-secret.yaml
# Kept out of k8s/ on purpose: ArgoCD syncs that folder and would deploy this.
#
# MARIADB_PASSWORD is the password of the "isw" user. food-api reads it from
# this Secret too, so it only lives here.
# Both passwords are only applied on the database's very first start: changing
# them here later does NOT change them in the database (do that with ALTER USER).
apiVersion: v1
kind: Secret
metadata:
  name: isw-db-secrets
  namespace: iswleuven
type: Opaque
stringData:
  MARIADB_PASSWORD: "<isw-user-password>"
  MARIADB_ROOT_PASSWORD: "<root-password>"
