apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: food-db-data
  namespace: iswleuven
  labels:
    app: food-db
  annotations:
    # All DB data lives on this volume. Never let ArgoCD prune or delete it,
    # even if this file is moved or removed from k8s/.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-db
  namespace: iswleuven
  labels:
    app: food-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: food-db
  template:
    metadata:
      labels:
        app: food-db
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MARIADB_DATABASE
              value: food
            - name: MARIADB_USER
              value: foodapi
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: food-db-secrets
                  key: MARIADB_PASSWORD
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: food-db-secrets
                  key: MARIADB_ROOT_PASSWORD
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            # First-start-only table setup (food-db-init.yaml). Ignored once data exists.
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
                - --innodb_initialized
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
                - --innodb_initialized
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: food-db-data
        - name: init
          configMap:
            name: food-db-init
---
apiVersion: v1
kind: Service
metadata:
  name: food-db
  namespace: iswleuven
  labels:
    app: food-db
spec:
  type: ClusterIP
  selector:
    app: food-db
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
