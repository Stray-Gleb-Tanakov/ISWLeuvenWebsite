apiVersion: apps/v1
kind: Deployment
metadata:
  name: iswleuven-website
  namespace: iswleuven
  labels:
    app: iswleuven-website
spec:
  replicas: 2
  selector:
    matchLabels:
      app: iswleuven-website
  template:
    metadata:
      labels:
        app: iswleuven-website
    spec:
      containers:
        - name: website
          image: ghcr.io/stray-gleb-tanakov/website-isw:b840d61d464ae869845e39994a6563585ff927cc
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi