apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iswleuven-website-ingress
  namespace: iswleuven
spec:
  ingressClassName: nginx
  rules:
    - host: iswleuven.be
      http:
        paths:
          # Longest prefix wins, so /api/members and /api/door go to their own APIs and the rest of /api to food-api
          - path: /api/door
            pathType: Prefix
            backend:
              service:
                name: door-api
                port:
                  number: 3000
          - path: /api/members
            pathType: Prefix
            backend:
              service:
                name: members-api
                port:
                  number: 3000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: food-api
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: iswleuven-website
                port:
                  number: 80