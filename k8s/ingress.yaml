apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iswleuven-website-ingress
  namespace: iswleuven
spec:
  ingressClassName: nginx
  rules:
    - host: iswleuven.be # replace with your real domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: iswleuven-website
                port:
                  number: 80