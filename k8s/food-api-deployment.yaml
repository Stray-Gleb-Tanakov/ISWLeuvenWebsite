apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-api
  namespace: iswleuven
  labels:
    app: food-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: food-api
  template:
    metadata:
      labels:
        app: food-api
    spec:
      containers:
        - name: food-api
          image: ghcr.io/stray-gleb-tanakov/food-api:14512fb1eac083069d896840dca6930ec29eb0c3
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          # Applied by hand, never committed: kubectl apply -f food-api/k8s-secret.yaml
          # (template: food-api/k8s-secret.example.yaml)
          envFrom:
            - secretRef:
                name: food-api-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/livez
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
