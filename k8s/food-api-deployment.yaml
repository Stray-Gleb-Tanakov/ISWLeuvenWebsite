apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-api
  namespace: iswleuven
  labels:
    app: food-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: food-api
  template:
    metadata:
      labels:
        app: food-api
    spec:
      containers:
        - name: food-api
          image: ghcr.io/stray-gleb-tanakov/food-api:b840d61d464ae869845e39994a6563585ff927cc
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          # Applied by hand, never committed: kubectl apply -f food-api/k8s-secret.yaml
          # (template: food-api/k8s-secret.example.yaml)
          envFrom:
            - secretRef:
                name: food-api-secrets
          # Game scores go to isw-db (k8s/isw-db.yaml). The password is shared with
          # isw-db's own Secret, so it only lives in one place.
          env:
            - name: GAME_DB_HOST
              value: isw-db
            - name: GAME_DB_PORT
              value: "3306"
            - name: GAME_DB_NAME
              value: isw
            - name: GAME_DB_USER
              value: isw
            - name: GAME_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: isw-db-secrets
                  key: MARIADB_PASSWORD
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/livez
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
