# Table setup for isw-db, mounted at /docker-entrypoint-initdb.d.
# MariaDB only runs these scripts when the data volume is EMPTY (first start).
# Once the database exists, editing or pushing this file changes nothing in it:
# schema changes to the live database are done by hand.
apiVersion: v1
kind: ConfigMap
metadata:
  name: isw-db-init
  namespace: iswleuven
  labels:
    app: isw-db
data:
  01-schema.sql: |
    -- Mainframe Breach leaderboard (food-api /api/scores).
    -- score = game_score + flags_found * flag points.
    -- version = scoring rules version; the board only shows the current one.
    CREATE TABLE IF NOT EXISTS game_scores (
      id          INT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
      version     TINYINT UNSIGNED NOT NULL DEFAULT 1,
      name        VARCHAR(16)  NOT NULL,
      class_name  VARCHAR(16)  NOT NULL,
      floor       TINYINT UNSIGNED NOT NULL,
      won         BOOLEAN      NOT NULL DEFAULT FALSE,
      game_score  INT UNSIGNED NOT NULL,
      flags_found TINYINT UNSIGNED NOT NULL DEFAULT 0,
      badge       VARCHAR(16)  NULL,
      score       INT UNSIGNED NOT NULL,
      created_at  TIMESTAMP    NOT NULL DEFAULT CURRENT_TIMESTAMP,
      INDEX (version, score)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
