# Template for the members-api Secret. Copy to k8s-secret.yaml (gitignored), fill
# in every <...>, then apply by hand:
#   kubectl apply -f members-api/k8s-secret.yaml
# Kept out of k8s/ on purpose: ArgoCD syncs that folder and would deploy this.
apiVersion: v1
kind: Secret
metadata:
  name: members-api-secrets
  namespace: iswleuven
type: Opaque
stringData:
  # SMTP account nodemailer sends the sign-up emails with (port 465 = TLS, 587 = STARTTLS)
  SMTP_HOST: "<smtp-host>"
  SMTP_PORT: "587"
  SMTP_USER: "<smtp-user>"
  SMTP_PASS: "<smtp-password>"
  MAIL_FROM: "ISW Leuven <<smtp-user>>"
  MAIL_TO: "isw@ucll.be"

  # Members database (separate from the food DB). Leave these out until it exists:
  # without DB_HOST the API only emails sign-ups.
  # DB_HOST: "<db-host>"
  # DB_PORT: "3306"
  # DB_USER: "<db-user>"
  # DB_PASSWORD: "<db-password>"
  # DB_NAME: "<db-name>"
