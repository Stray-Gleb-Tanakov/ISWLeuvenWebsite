name: Package & Publish Website

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, 'ci: deploy')"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/stray-gleb-tanakov/website-isw:${{ github.sha }}
            ghcr.io/stray-gleb-tanakov/website-isw:latest

      - name: Update deployment image tag
        run: |
          sed -i \
            "s#image: ghcr.io/stray-gleb-tanakov/website-isw:.*#image: ghcr.io/stray-gleb-tanakov/website-isw:${{ github.sha }}#" \
            k8s/deployment.yaml

      - name: Commit deployment update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet k8s/deployment.yaml; then
            echo "No deployment image change"
            exit 0
          fi

          git add k8s/deployment.yaml
          git commit -m "ci: deploy ${{ github.sha }}"
          git push origin HEAD:main
